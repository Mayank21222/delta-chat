[project]
name = "delta-chat"
version = "0.1.0"
description = "Document Delta & Grounded Chat — P&ID revision comparison with LLM-powered Q&A"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23",
    "pdfplumber>=0.10",
    "pdf2image>=1.16",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
